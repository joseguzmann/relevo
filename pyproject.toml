[project]
name = "relevo"
version = "0.1.0"
description = "Takes a job from Vigía to a filled application; nothing goes out until a person approves it."
requires-python = ">=3.11"
dependencies = ["playwright>=1.49"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
